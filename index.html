<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة فودو المحلية</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 30px;
        }
        .player-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 30px auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-body {
            padding: 10px;
            text-align: center;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-cat {
            font-size: 11px;
            color: #b3b3b3;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>مكتبة فودو السينمائية</h1>

    <div class="player-container">
        <video id="mainPlayer" controls autoplay>
            <source src="" type="video/mp4">
            متصفحك لا يدعم مشغل الفيديو.
        </video>
    </div>

    <h3 style="max-width: 1100px; margin: 0 auto 15px auto;" id="sectionTitle">المحتوى المتاح</h3>
    <div class="grid" id="moviesGrid"></div>

    <script>
        const moviesData = [
            {
                "title": "Breaking Bad",
                "image": "https://m.media-amazon.com/images/M/MV5BYmQ4YWMxYjEtNjZmYi00NTQ1LWFjMjAtNjA0OWJiYjYxMTQ5XkEyXkFqcGc@._V1_.jpg",
                "video_url": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                "category": "مسلسلات"
            },
            {
                "title": "Interstellar",
                "image": "https://m.media-amazon.com/images/M/MV5BZjdkOTU3MDktN2IxOS00OGEyLWFmMjktY2FiMmZkNWIyODZiXkEyXkFqcGc@._V1_.jpg",
                "video_url": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
                "category": "أفلام خيال علمي"
            },
            {
                "title": "Peaky Blinders",
                "image": "https://m.media-amazon.com/images/M/MV5BZjYzZDgzMmYtYjY5Zi00YTk1LThjY2YtNjdiMDQ4NGY0OGY1XkEyXkFqcGc@._V1_.jpg",
                "video_url": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                "category": "مسلسلات دراما"
            },
            {
                "title": "The Dark Knight",
                "image": "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg",
                "video_url": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
                "category": "أفلام أكشن"
            }
        ];
const grid = document.getElementById('moviesGrid');
        const player = document.getElementById('mainPlayer');
        const sectionTitle = document.getElementById('sectionTitle');
        
        sectionTitle.innerText = "المحتوى المتاح (" + moviesData.length + " عنصر)";

        if (moviesData.length > 0 && moviesData[0].video_url) {
            player.src = moviesData[0].video_url;
        }

        moviesData.forEach(function(movie) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = '<img src="' + movie.image + '" alt="' + movie.title + '">' +
                             '<div class="card-body">' +
                             '<p class="card-title">' + movie.title + '</p>' +
                             '<p class="card-cat">' + movie.category + '</p>' +
                             '</div>';
            
            card.addEventListener('click', function() {
                if (movie.video_url) {
                    player.src = movie.video_url;
                    player.play();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            
            grid.appendChild(card);
        });
    </script>

</body>
</html>
